name: Sync hookmanuk upstream

on:
  schedule:
    # Check daily at 07:17 UTC
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream openxr into fork master
        id: sync
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/hookmanuk/rpcs3.git
          git fetch upstream openxr

          if git merge-base --is-ancestor upstream/openxr HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
            exit 0
          fi

          if git merge --no-edit upstream/openxr; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream merge failed. Resolve conflicts before syncing."
            exit 1
          fi

      - name: Push updated fork master
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Trigger AppImage build
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run appimage.yml --ref master
